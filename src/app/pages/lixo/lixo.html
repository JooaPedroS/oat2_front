<main class="app">
  <header class="hero">
    <div>
      <span class="hero-tag">♻️ EcoApp</span>
      <h1>Lista de Reciclagem</h1>
      <p>Acompanhe seus itens recicláveis.</p>
    </div>

    <a class="back" routerLink="/">← Voltar</a>
  </header>

  <p class="resumo">{{ progresso() | percent }} depositado | Total: {{ total() }} Item/Itens</p>

  <section class="panel">
    <app-item-form (adicionarItem)="adicionar($event)" />
  </section>

  <section class="panel">
    <app-item-list
      [itens]="itens()"
      (alternarItem)="alternar($event)"
      (removerItem)="remover($event)"
    />
  </section>

  <section class="panel">
    <app-trash-map [itens]="itens()" />
  </section>
</main>
