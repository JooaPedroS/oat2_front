<router-outlet />
<main class="app">
    <h1>Minha Lista de reciclagem</h1>
    <p class="data">Hoje: {{ hoje | date:'dd/MM/yyyy' }}</p>
    <form class="form" (ngSubmit)="adicionar()">
        <input [(ngModel)]="novoItem" name="nome" placeholder="O que falta adicionar" />
        <input [(ngModel)]="novoQuant" name="Quantidade" type="number" placeholder="Quantidade" />
        <button type="submit">Adicionar</button>
    </form>

    <p class="resumo">{{ progresso() | percent }} Depositado | Total: {{ total() }}</p>

    <ul class="lista">
        @for (item of itens(); track item.nome) {
           <li [class.comprado]="item.Depositado">
            <span class="nome">{{ item.nome | titlecase }}</span>
            <span class="preco">{{ item.Quantidade }}</span>
            <button (click)="alternar(item)">
        @if (item.Depositado) { Depositei } @else { Não Depositado }
            </button>
<button class="remover" (click)="remover(item)">x</button>
            </li>
        } 
        @empty {
            <li>Sua lista está vazia.</li>
        }
    </ul>
</main>
